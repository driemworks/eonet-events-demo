<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Natural events, observed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600;700&display=swap">
<style>
/* Concept: the planet as an instrument readout. Land is a lattice of sensor cells, events glow in their own spectral
   band (each EONET category keeps one color), and every panel is a pane of smoked glass floating over the orbit. */
:root {
  --void: #03060d; --deep: #071226; --glass: rgba(16, 26, 48, .42); --glass-hi: rgba(120, 170, 255, .10);
  --line: rgba(160, 200, 255, .12); --ink: #e9f0ff; --dim: #8796b4; --faint: #55627d; --ion: #7cc4ff;
  --font: "Geologica", system-ui, sans-serif;
}
* { box-sizing: border-box }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--void); color: var(--ink); font: 400 14px/1.45 var(--font); -webkit-font-smoothing: antialiased }
button, input, select { font: inherit; color: inherit }
a { color: var(--ion); text-decoration: none }
a:hover { text-decoration: underline }
:focus-visible { outline: 1.5px solid var(--ion); outline-offset: 2px }

#sky { position: fixed; inset: 0; background:
  radial-gradient(1200px 800px at 62% 50%, #0b1d3d 0%, transparent 60%),
  radial-gradient(900px 600px at 10% 110%, #160b2e 0%, transparent 60%), var(--void) }
#globe { position: fixed; inset: 0 }
#globe canvas { cursor: grab }
#globe canvas:active { cursor: grabbing }

.glass {
  background: linear-gradient(160deg, var(--glass-hi), transparent 40%), var(--glass);
  backdrop-filter: blur(22px) saturate(160%); -webkit-backdrop-filter: blur(22px) saturate(160%);
  border: 1px solid var(--line);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .07), 0 30px 80px -20px rgba(0, 0, 0, .6);
}

/* Title: sits on the glass rail, no panel of its own */
.rail { position: fixed; z-index: 2; top: max(18px, env(safe-area-inset-top)); left: 18px; bottom: 18px; width: 360px;
  border-radius: 22px; display: flex; flex-direction: column; min-height: 0; overflow: hidden }
.head { padding: 22px 22px 14px; display: grid; gap: 14px }
h1 { margin: 0; font-weight: 300; font-size: 26px; line-height: 1.1; letter-spacing: -.02em }
h1 + p { margin: -6px 0 0; color: var(--dim); font-size: 13px; font-weight: 300 }
.counter { display: flex; gap: 28px }
.counter div { display: flex; gap: 8px; align-items: baseline }
.counter b { font-weight: 600; font-size: 30px; letter-spacing: -.03em; font-variant-numeric: tabular-nums }
.counter span { color: var(--dim); font-size: 12.5px; white-space: nowrap }
.counter .live { display: inline-flex; gap: 6px; align-items: center }
.counter .live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #5cf2b0; box-shadow: 0 0 10px #5cf2b0 }

.search { position: relative }
.search input { width: 100%; padding: 11px 14px 11px 36px; border-radius: 12px; border: 1px solid var(--line); background: rgba(4, 10, 22, .55); outline: none; transition: border-color .2s }
.search input:focus { border-color: rgba(124, 196, 255, .5) }
.search input::placeholder { color: var(--faint) }
.search svg { position: absolute; left: 12px; top: 50%; translate: 0 -50%; opacity: .5 }

.bands { display: flex; flex-wrap: wrap; gap: 6px }
.band { display: inline-flex; align-items: center; gap: 7px; padding: 5px 10px 5px 8px; border-radius: 999px; border: 1px solid var(--line);
  background: rgba(255, 255, 255, .03); font-size: 12px; cursor: pointer; transition: opacity .2s, background .2s }
.band i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c) }
.band small { color: var(--dim); font-variant-numeric: tabular-nums }
.band[aria-pressed=false] { opacity: .35 }
.band:hover { background: rgba(255, 255, 255, .07) }

.seg { display: flex; padding: 3px; border-radius: 10px; background: rgba(4, 10, 22, .55); border: 1px solid var(--line) }
.seg button { flex: 1; border: 0; background: none; padding: 6px 0; border-radius: 7px; font-size: 12.5px; color: var(--dim); cursor: pointer; transition: background .2s, color .2s }
.seg button[aria-pressed=true] { background: rgba(124, 196, 255, .14); color: var(--ink) }

#status { color: var(--faint); font-size: 12px; padding: 0 22px 8px }
#list { list-style: none; margin: 0; padding: 0 10px 10px; overflow-y: auto; flex: 1; scrollbar-width: thin; scrollbar-color: rgba(160, 200, 255, .15) transparent;
  mask-image: linear-gradient(to bottom, transparent 0, #000 12px, #000 calc(100% - 24px), transparent 100%) }
#list li { display: grid; grid-template-columns: 10px 1fr auto; gap: 4px 12px; align-items: center; padding: 10px 12px; border-radius: 12px; cursor: pointer; transition: background .15s }
#list li:hover { background: rgba(255, 255, 255, .045) }
#list li[aria-current=true] { background: rgba(124, 196, 255, .12) }
#list li i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); grid-row: span 2 }
#list li.closed i { background: transparent; box-shadow: none; border: 1.5px solid var(--c) }
#list li b { font-weight: 500; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
#list li em { font-style: normal; font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; text-align: right }
#list li span { grid-column: 2 / 4; font-size: 12px; color: var(--faint) }
.foot { padding: 12px 22px 16px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--faint) }

/* Detail card */
.card { position: fixed; z-index: 2; right: 18px; bottom: 18px; width: 380px; border-radius: 26px; padding: 22px 24px 20px;
  display: grid; gap: 14px; transform-origin: bottom right; transition: opacity .35s cubic-bezier(.2, .8, .2, 1), transform .35s cubic-bezier(.2, .8, .2, 1) }
.card[hidden] { display: grid; opacity: 0; transform: translateY(12px) scale(.98); pointer-events: none }
.card .x { position: absolute; top: 14px; right: 14px; width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: rgba(255, 255, 255, .04); cursor: pointer; display: grid; place-items: center }
.card .x:hover { background: rgba(255, 255, 255, .1) }
.cat { display: inline-flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--dim) }
.cat i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c) }
.card h2 { margin: -6px 0 0; font-weight: 400; font-size: 22px; line-height: 1.2; letter-spacing: -.015em; padding-right: 30px }
.card .desc { margin: -6px 0 0; color: var(--dim); font-size: 13px }
.mag { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px }
.mag b { font-weight: 600; font-size: 40px; line-height: 1; letter-spacing: -.035em; font-variant-numeric: tabular-nums; color: var(--c); text-shadow: 0 0 30px color-mix(in srgb, var(--c) 50%, transparent) }
.mag small { display: block; font-size: 12.5px; color: var(--dim); margin-top: 6px }
.mag svg { flex: 1; max-width: 170px; height: 46px; overflow: visible }
dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 13px }
dt { color: var(--faint) }
dd { margin: 0; font-variant-numeric: tabular-nums }
.state { display: inline-flex; align-items: center; gap: 6px }
.state.open::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #5cf2b0; box-shadow: 0 0 8px #5cf2b0 }
.proof { border-top: 1px solid var(--line); padding-top: 12px; font-size: 11.5px; color: var(--faint); display: grid; gap: 4px }
.proof code { color: var(--dim); font: 11px/1.4 ui-monospace, monospace; word-break: break-all }

.tip { position: fixed; z-index: 3; pointer-events: none; padding: 7px 11px; border-radius: 10px; font-size: 12.5px; white-space: nowrap; translate: 14px -50% }
.tip[hidden] { display: none }

.err { position: fixed; inset: 0; display: grid; place-items: center; z-index: 4; padding: 24px }
.err div { max-width: 420px; padding: 24px; border-radius: 20px; display: grid; gap: 8px }
.err h2 { margin: 0; font-weight: 400; font-size: 18px }
.err p { margin: 0; color: var(--dim) }

@media (max-width: 820px) {
  .rail { top: auto; left: 10px; right: 10px; bottom: 10px; width: auto; height: 46dvh; border-radius: 20px }
  .head { padding: 16px 16px 10px; gap: 10px }
  h1 { font-size: 21px } h1 + p { display: none }
  .counter b { font-size: 24px }
  .card { left: 10px; right: 10px; bottom: auto; top: max(10px, env(safe-area-inset-top)); width: auto; border-radius: 20px; padding: 18px }
  .mag b { font-size: 32px }
}
@media (prefers-reduced-motion: reduce) { .card, .band, #list li { transition: none } }
</style>
</head>
<body>
<div id="sky"></div>
<div id="globe" aria-label="Globe of natural events"></div>

<aside class="rail glass">
  <div class="head">
    <h1>Natural events, observed</h1>
    <p>Wildfires, storms, floods and ice, tracked by NASA's Earth Observatory and kept on Fangorn</p>
    <div class="counter"><div><b id="n-open">–</b><span class="live">active now</span></div><div><b id="n-all" style="font-weight:300">–</b><span>on record</span></div></div>
    <label class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search, e.g. cyclone or wildfire Bolivia" autocomplete="off" aria-label="Search events">
    </label>
    <div class="bands" id="bands"></div>
    <div class="seg" id="seg" role="group" aria-label="Status">
      <button data-v="all" aria-pressed="true">All</button><button data-v="open" aria-pressed="false">Active</button><button data-v="closed" aria-pressed="false">Ended</button>
    </div>
  </div>
  <div id="status">Loading events…</div>
  <ul id="list"></ul>
  <div class="foot">Source: <a href="https://eonet.gsfc.nasa.gov/" target="_blank" rel="noopener">NASA EONET</a>. Every record is signed and versioned on <a id="src" target="_blank" rel="noopener">Fangorn</a>.</div>
</aside>

<article class="card glass" id="card" hidden aria-live="polite"></article>
<div class="tip glass" id="tip" hidden></div>

<script src="https://unpkg.com/globe.gl@2.46.2/dist/globe.gl.min.js"></script>
<script src="https://unpkg.com/topojson-client@3/dist/topojson-client.min.js"></script>
<script>
// The Fangorn indexer this page reads (its /view.json and /search). ?index=<url> points it at another one.
const INDEX = (new URLSearchParams(location.search).get("index") ?? "https://eonet-events-sepolia.fangorn.network").replace(/\/$/, "");
// One spectral band per EONET category id: the color follows the category, never its rank.
const BANDS = { wildfires: "#ff7a3d", severeStorms: "#b48cff", volcanoes: "#ff4d6d", seaLakeIce: "#7cd9ff", floods: "#3ddbd9", earthquakes: "#f7a8ff",
  drought: "#ffd166", dustHaze: "#d6b48a", landslides: "#c9a27a", snow: "#e3f2ff", tempExtremes: "#ff8fb1", waterColor: "#6ef0a0", manmade: "#a3adbf" };
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const band = (e) => BANDS[e.cat.id] ?? "#a3adbf";
const date = (t, y = true) => t ? new Date(t).toLocaleDateString(undefined, { month: "short", day: "numeric", ...(y && { year: "numeric" }) }) : "";
const ago = (t) => { const d = Math.round((Date.now() - Date.parse(t)) / 864e5); return d <= 0 ? "today" : d === 1 ? "yesterday" : `${d}d ago`; };

let events = [], byId = new Map(), on = new Set(), hits = null, status = "all", current = null;

// ── data ──────────────────────────────────────────────────────────────────────────────────────────
// [lat, lng] of a geometry entry: a point, or a polygon's first-ring centroid.
function ll(g) {
  if (g.type === "Point") return [g.coordinates[1], g.coordinates[0]];
  const ring = g.coordinates?.[0] ?? [];
  if (!ring.length) return null;
  const s = ring.reduce((a, [x, y]) => [a[0] + y, a[1] + x], [0, 0]);
  return [s[0] / ring.length, s[1] / ring.length];
}
function toEvent(r) {
  const p = r.payload, geo = [...(p.geometry ?? [])].sort((a, b) => a.date.localeCompare(b.date)), last = geo.at(-1), at = last && ll(last);
  return { id: r.id, cid: r.cid, title: p.title, description: p.description, link: p.link, closed: p.closed, sources: p.sources ?? [],
    cat: p.categories?.[0] ?? { id: "other", title: "Other" }, geo, first: geo[0]?.date, last: last?.date,
    lat: at?.[0], lng: at?.[1], mag: last?.magnitudeValue, unit: last?.magnitudeUnit };
}
const visible = () => events.filter((e) => on.has(e.cat.id) && (!hits || hits.has(e.id)) && (status === "all" || (status === "open") === !e.closed));
const fmtMag = (e) => e.mag == null ? "" : `${Number(e.mag).toLocaleString(undefined, { maximumFractionDigits: 1 })} ${e.unit === "kts" ? "kt" : e.unit ?? ""}`;

// ── globe ─────────────────────────────────────────────────────────────────────────────────────────
// The globe needs WebGL; without it the rail and the card still work.
let globe = null, ctl = { autoRotate: false }, idle;
try {
globe = Globe({ animateIn: !REDUCED })($("globe"))
  .backgroundColor("rgba(0,0,0,0)")
  .showAtmosphere(true).atmosphereColor("#3d8bff").atmosphereAltitude(0.22)
  .showGraticules(true)
  .hexPolygonResolution(3).hexPolygonMargin(0.42).hexPolygonUseDots(true).hexPolygonAltitude(0.004)
  .hexPolygonColor(() => "rgba(140, 190, 255, 0.55)")
  .pointLat("lat").pointLng("lng").pointRadius((e) => e === current ? 0.55 : 0.22).pointResolution(8)
  .pointAltitude((e) => e === current ? 0.08 : e.closed ? 0.006 : 0.02)
  .pointColor((e) => e.closed ? band(e) + "88" : band(e))
  .pointLabel(() => "")
  .onPointHover(hover).onPointClick((e) => select(e))
  .ringLat("lat").ringLng("lng").ringColor((e) => (t) => `${band(e)}${Math.round((1 - t) * 200).toString(16).padStart(2, "0")}`)
  .ringMaxRadius((e) => e === current ? 6 : 2.6).ringPropagationSpeed(REDUCED ? 0 : 1.4).ringRepeatPeriod((e) => e === current ? 900 : 1800)
  .pathPoints("pts").pathPointLat((p) => p[0]).pathPointLng((p) => p[1]).pathPointAlt(0.012)
  .pathColor((p) => [p.color + "22", p.color]).pathStroke(2.2)
  .pathDashLength(0.08).pathDashGap(0.012).pathDashAnimateTime(REDUCED ? 0 : 12000)
  .onGlobeClick(() => select(null));

const mat = globe.globeMaterial();
mat.color.set("#06132a"); mat.emissive?.set("#020814"); mat.emissiveIntensity = 1; mat.shininess = 18; mat.specular?.set("#1b3a6b");
// soften the graticule into a faint sensor grid
globe.scene().traverse((o) => { if (o.type === "LineSegments" && o.material) { o.material.color?.set("#3a6bb5"); o.material.transparent = true; o.material.opacity = 0.12; } });

ctl = globe.controls();
ctl.autoRotate = !REDUCED; ctl.autoRotateSpeed = 0.35; ctl.enableDamping = true; ctl.dampingFactor = 0.08;
ctl.minDistance = 130; ctl.maxDistance = 600;
globe?.pointOfView({ lat: 18, lng: -40, altitude: 2.3 });
ctl.addEventListener("start", () => { ctl.autoRotate = false; clearTimeout(idle); });
ctl.addEventListener("end", () => { clearTimeout(idle); if (!REDUCED && !current) idle = setTimeout(() => (ctl.autoRotate = true), 6000); });

function size() { globe.width(innerWidth).height(innerHeight); }
addEventListener("resize", size); size();

fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json").then((r) => r.json())
  .then((w) => globe.hexPolygonsData(topojson.feature(w, w.objects.countries).features)).catch(() => {});

} catch (err) {
  globe = null;
  $("globe").innerHTML = `<p style="position:fixed;right:24px;top:24px;max-width:300px;margin:0;color:var(--faint);font-size:12.5px">This browser can't draw the 3D globe (WebGL is off), so events are listed only.</p>`;
}

// hover tooltip
const tip = $("tip");
let mouse = [0, 0];
addEventListener("pointermove", (ev) => { mouse = [ev.clientX, ev.clientY]; if (!tip.hidden) Object.assign(tip.style, { left: `${mouse[0]}px`, top: `${mouse[1]}px` }); });
function hover(e) {
  const cv = $("globe").querySelector("canvas"); if (cv) cv.style.cursor = e ? "pointer" : "";
  if (!e) return void (tip.hidden = true);
  tip.innerHTML = `<span style="color:${band(e)}">●</span> ${esc(e.title)}`;
  Object.assign(tip.style, { left: `${mouse[0]}px`, top: `${mouse[1]}px` });
  tip.hidden = false;
}

// ── selection ─────────────────────────────────────────────────────────────────────────────────────
function spark(e) {
  const xs = e.geo.filter((g) => g.magnitudeValue != null);
  if (xs.length < 2) return "";
  const t0 = Date.parse(xs[0].date), t1 = Date.parse(xs.at(-1).date) || t0 + 1, vs = xs.map((g) => +g.magnitudeValue);
  const lo = Math.min(...vs), hi = Math.max(...vs) || 1;
  const pts = xs.map((g, i) => [((Date.parse(g.date) - t0) / (t1 - t0 || 1)) * 170, 42 - ((vs[i] - lo) / (hi - lo || 1)) * 38]);
  const d = pts.map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join("");
  return `<svg viewBox="0 0 170 46" preserveAspectRatio="none" aria-label="Magnitude over time"><defs><linearGradient id="sg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${band(e)}" stop-opacity=".35"/><stop offset="1" stop-color="${band(e)}" stop-opacity="0"/></linearGradient></defs>
    <path d="${d}L170 46L0 46Z" fill="url(#sg)"/><path d="${d}" fill="none" stroke="${band(e)}" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
    <circle cx="${pts.at(-1)[0]}" cy="${pts.at(-1)[1]}" r="3" fill="${band(e)}"/></svg>`;
}

function card(e) {
  const days = e.first && e.last ? Math.max(1, Math.round((Date.parse(e.closed ?? e.last) - Date.parse(e.first)) / 864e5)) : null;
  const src = e.sources.map((s) => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.id)}</a>`).join(", ");
  const m = fmtMag(e);
  return `<button class="x" id="close" aria-label="Close"><svg width="12" height="12" viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.6"><path d="M2 2l8 8M10 2l-8 8"/></svg></button>
    <span class="cat" style="--c:${band(e)}"><i></i>${esc(e.cat.title)}</span>
    <h2>${esc(e.title)}</h2>
    ${e.description ? `<p class="desc">${esc(e.description)}</p>` : ""}
    ${m ? `<div class="mag" style="--c:${band(e)}"><div><b>${esc(m.split(" ")[0])}</b><small>${esc(m.split(" ").slice(1).join(" ") || "magnitude")} at last observation</small></div>${spark(e)}</div>` : ""}
    <dl>
      <dt>Status</dt><dd><span class="state ${e.closed ? "" : "open"}">${e.closed ? `Ended ${date(e.closed)}` : "Active"}</span></dd>
      <dt>Observed</dt><dd>${date(e.first, false)}${e.last !== e.first ? ` to ${date(e.last)}` : `, ${new Date(e.first).getFullYear()}`}${days ? ` (${days} day${days === 1 ? "" : "s"})` : ""}</dd>
      <dt>Readings</dt><dd>${e.geo.length}</dd>
      <dt>Location</dt><dd>${e.lat?.toFixed(2)}°, ${e.lng?.toFixed(2)}°</dd>
      <dt>Reported by</dt><dd>${src || "–"}</dd>
    </dl>
    <div class="proof"><span>Fangorn record ${esc(e.id)}, <a href="${esc(e.link)}" target="_blank" rel="noopener">see it on EONET</a></span>${e.cid ? `<code>${esc(e.cid)}</code>` : ""}</div>`;
}

function select(e) {
  current = e ?? null;
  const c = $("card");
  if (!e) {
    c.hidden = true; globe?.pathsData([]); paint();
    if (!REDUCED) idle = setTimeout(() => (ctl.autoRotate = true), 4000);
    return markList();
  }
  clearTimeout(idle); ctl.autoRotate = false;
  c.innerHTML = card(e); c.style.setProperty("--c", band(e)); c.hidden = false;
  $("close").onclick = () => select(null);
  const pts = e.geo.map(ll).filter(Boolean);
  globe?.pathsData(pts.length > 1 ? [{ pts, color: band(e) }] : []);
  globe?.pointOfView({ lat: e.lat, lng: e.lng, altitude: pts.length > 1 ? 1.1 : 0.9 }, REDUCED ? 0 : 1400);
  paint(); markList();
  document.querySelector(`#list li[data-id="${CSS.escape(e.id)}"]`)?.scrollIntoView({ block: "nearest", behavior: REDUCED ? "auto" : "smooth" });
}
addEventListener("keydown", (ev) => { if (ev.key === "Escape" && current) select(null); });

// ── render ────────────────────────────────────────────────────────────────────────────────────────
function paint() {
  const xs = visible().filter((e) => e.lat != null);
  globe?.pointsData(xs);
  // rings on the most recent active events (and the selection), capped so the GPU stays cool
  const rings = xs.filter((e) => !e.closed).slice(0, 80);
  if (current && !rings.includes(current)) rings.push(current);
  globe?.ringsData(rings);
}
function markList() { document.querySelectorAll("#list li").forEach((li) => li.setAttribute("aria-current", li.dataset.id === current?.id)); }
function render() {
  const xs = visible();
  paint();
  $("list").innerHTML = xs.slice(0, 400).map((e) => `<li data-id="${esc(e.id)}" class="${e.closed ? "closed" : ""}" style="--c:${band(e)}" aria-current="${e === current}">
    <i></i><b>${esc(e.title)}</b><em>${esc(fmtMag(e))}</em><span>${esc(e.cat.title)}, ${e.closed ? `ended ${date(e.closed, false)}` : `active, seen ${ago(e.last)}`}</span></li>`).join("");
  $("status").textContent = hits ? `${xs.length} match${xs.length === 1 ? "" : "es"}` : `Showing ${xs.length.toLocaleString()} of ${events.length.toLocaleString()}${xs.length > 400 ? " (first 400 listed)" : ""}`;
}

$("list").addEventListener("click", (ev) => { const li = ev.target.closest("li[data-id]"); if (li) select(byId.get(li.dataset.id)); });
$("bands").addEventListener("click", (ev) => {
  const b = ev.target.closest(".band"); if (!b) return;
  on.has(b.dataset.k) ? on.delete(b.dataset.k) : on.add(b.dataset.k);
  b.setAttribute("aria-pressed", on.has(b.dataset.k)); render();
});
$("seg").addEventListener("click", (ev) => {
  const b = ev.target.closest("button"); if (!b) return;
  status = b.dataset.v; $("seg").querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x === b)); render();
});
let t;
$("q").addEventListener("input", (ev) => {
  clearTimeout(t);
  const q = ev.target.value.trim();
  t = setTimeout(async () => {
    if (!q) { hits = null; return render(); }
    $("status").textContent = "Searching…";
    try { hits = new Set((await fetch(`${INDEX}/search?q=${encodeURIComponent(q)}&k=100&type=event`).then((r) => r.json())).map((r) => r.id)); }
    catch (err) { hits = null; $("status").textContent = `Search is unavailable right now (${err.message}). Filters still work.`; return; }
    render();
  }, 300);
});

(async () => {
  $("src").href = `${INDEX}/view.json`;
  try {
    // The indexer lets browsers cache the view for hours; revalidate so the latest ingest shows up.
    const v = await fetch(`${INDEX}/view.json`, { cache: "no-cache" }).then((r) => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); });
    events = v.records.filter((r) => r.type === "event").map(toEvent).sort((a, b) => (b.last ?? "").localeCompare(a.last ?? ""));
  } catch (err) {
    $("status").textContent = "";
    document.body.insertAdjacentHTML("beforeend", `<div class="err"><div class="glass"><h2>Couldn't reach the event index</h2><p>${esc(INDEX)} didn't answer (${esc(err.message)}). Add <b>?index=</b> with another indexer's URL to the address to use that one.</p></div></div>`);
    return;
  }
  for (const e of events) byId.set(e.id, e);
  const counts = {};
  for (const e of events) (counts[e.cat.id] ??= { title: e.cat.title, n: 0 }).n++;
  on = new Set(Object.keys(counts));
  $("bands").innerHTML = Object.entries(counts).sort((a, b) => b[1].n - a[1].n)
    .map(([id, c]) => `<button class="band" data-k="${esc(id)}" aria-pressed="true" style="--c:${BANDS[id] ?? "#a3adbf"}"><i></i>${esc(c.title)}<small>${c.n.toLocaleString()}</small></button>`).join("");
  $("n-open").textContent = events.filter((e) => !e.closed).length.toLocaleString();
  $("n-all").textContent = events.length.toLocaleString();
  render();
})();
</script>
</body>
</html>
